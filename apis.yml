aid: recuro-health
name: Recuro Health
description: 'Recuro Health is an integrated digital health company operating a virtual-first
  care delivery platform — a "Digital Medical Home" — sold to employers, health plans,
  TPAs and diagnostics companies rather than to individual developers. Its configurable
  SaaS platform bundles core virtual care services (virtual primary care, virtual urgent
  care, virtual behavioral health) with supplemental benefits including on-demand counseling,
  pediatric behavioral health, health advocacy, prescription benefit, wellness programs
  and virtual MSK therapy, plus at-home lab and genomic diagnostics. Members reach care
  through the Recuro Care iOS/Android apps and the member.recurohealth.com web app, with
  identity handled by an Auth0-hosted OpenID Connect authorization server at auth.recurohealth.com.
  Recuro Health is HITRUST certified and absorbed WellVia Solutions. The company markets
  platform integration (SSO, APIs, eligibility and reporting) to its enterprise clients,
  but publishes no public developer program: its documentation host requires a GitHub
  login and its ReadMe developer hub is not publicly served.'
